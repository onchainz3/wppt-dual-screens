<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>WPPT screens — control</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12211C;
    --ink:#FFF8F0;
    --muted:#B3C4BC;
    --accent:#FF5C1F;
    --line:rgba(255,248,240,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--navy);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  body{padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
  main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  .eyebrow{font-size:13px;font-weight:500;color:var(--accent)}
  h1{font-family:"Archivo",sans-serif;font-size:26px;line-height:1.1}
  .card{border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px}
  .card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .card .title{font-family:"Archivo",sans-serif;font-size:18px;line-height:1.2}
  .card .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  button{font:600 17px "Inter",system-ui,sans-serif;border-radius:6px;padding:18px;border:1px solid var(--line);background:transparent;color:var(--ink);width:100%;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#12211C}
  button:disabled{opacity:.5}
  .hint{font-size:13px;color:var(--muted);line-height:1.4}
  input{font:500 22px "Inter",system-ui,sans-serif;letter-spacing:.3em;text-align:center;padding:14px;border-radius:6px;border:1px solid var(--line);background:rgba(255,248,240,.06);color:var(--ink);width:100%}
  #msg{font-size:14px;min-height:20px}
  #msg.err{color:#ff8a65}
  #msg.ok{color:#9be3b5}
  .hidden{display:none !important}
  .link{background:none;border:0;padding:4px;width:auto;font-size:13px;font-weight:500;color:var(--muted);text-decoration:underline;align-self:center}
</style>
</head>
<body>
<main>
  <div>
    <div class="eyebrow">WPPT 2026 · Booth screens</div>
    <h1>Screen control</h1>
  </div>

  <section id="login" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <label class="hint" for="pin">Enter the control PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <button id="unlock" class="primary">Unlock</button>
  </section>

  <section id="panel" class="hidden" style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <div class="label">Should be playing now</div>
      <div class="title" id="nowTitle">…</div>
      <div class="meta" id="nowMeta"></div>
    </div>

    <button id="reload" class="primary">Reload both screens</button>
    <p class="hint">Use this when the big and small screens look out of step. Both reload and pick up at the right point in the current talk, usually within 15 seconds.</p>

    <button id="restart">Restart from talk 1</button>
    <p class="hint">Starts the whole playlist again from the first talk on the big and small screens.</p>

    <button id="logout" class="link">Forget PIN on this phone</button>
  </section>

  <div id="msg" role="status"></div>
</main>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const PIN_KEY = 'wppt-control-pin';
const getPin = () => { try { return localStorage.getItem(PIN_KEY) || ''; } catch(e){ return ''; } };
const setPin = v => { try { v ? localStorage.setItem(PIN_KEY, v) : localStorage.removeItem(PIN_KEY); } catch(e){} };

function say(text, kind){ $('msg').textContent = text; $('msg').className = kind || ''; }
function show(id){ ['login','panel'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

async function send(action, pin){
  const res = await fetch('/api/control', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ pin, action }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('error ' + res.status));
  return data;
}

$('unlock').onclick = async () => {
  const pin = $('pin').value.trim();
  if (!pin) return;
  $('unlock').disabled = true;
  try { await send('check', pin); setPin(pin); say(''); show('panel'); }
  catch(e){ say(e.message === 'wrong PIN' ? 'Wrong PIN.' : 'Could not reach the server: ' + e.message, 'err'); }
  $('unlock').disabled = false;
};
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('unlock').click(); });

async function act(btn, action, confirmText, doneText){
  if (confirmText && !confirm(confirmText)) return;
  btn.disabled = true; say('Sending…');
  try { await send(action, getPin()); say(doneText, 'ok'); }
  catch(e){
    if (e.message === 'wrong PIN') { setPin(''); show('login'); say('PIN changed — enter it again.', 'err'); }
    else say('Failed: ' + e.message, 'err');
  }
  btn.disabled = false;
}
$('reload').onclick = e => act(e.target, 'reload', null, 'Sent. Both screens reload within 15 seconds.');
$('restart').onclick = e => act(e.target, 'restart', 'Restart the playlist from talk 1 on the big and small screens?', 'Sent. Both screens restart from talk 1 within 15 seconds.');
$('logout').onclick = () => { setPin(''); $('pin').value = ''; show('login'); say(''); };

function fmt(s){ s = Math.max(0, Math.floor(s)); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); }
function tick(){
  const p = CONFIG.currentPhase();
  if (p.loading) return;
  if (p.notStarted) { $('nowTitle').textContent = 'Not started yet'; $('nowMeta').textContent = 'Starts ' + new Date(CONFIG.START_TIME).toLocaleString(); return; }
  $('nowTitle').textContent = p.talk.title;
  $('nowMeta').textContent = 'Talk ' + (p.index + 1) + ' of ' + CONFIG.TALKS.length + ' · ' + fmt(p.offset) + ' / ' + fmt(p.talk.duration);
}

CONFIG.followReloads = false;  // this page must not reload itself
show(getPin() ? 'panel' : 'login');
(async () => {
  await CONFIG.boot();
  tick();
  setInterval(tick, 1000);
  CONFIG.startPolling(tick);
})();
</script>
</body>
</html>
