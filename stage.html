<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>WPPT 2026 — Stage screen (sessions)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12211C;
  --navy-deep:#0B1915;
  --block:#1C352B;
  --lime:#FF5C1F;
  --ink:#FFF8F0;
  --muted:#B3C4BC;
  --panel:rgba(11,25,21,.92);
  --line:rgba(179,196,188,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy);color:var(--ink);overflow:hidden;font-family:"Inter",system-ui,sans-serif}
body.idle{cursor:none}

/* ---------- 1920×1080 stage, scaled to fit any screen ---------- */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--navy);overflow:hidden}
#pixels{display:none}
#pxcanvas{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
body.kv #pxcanvas{display:none}
#pixels rect{fill:var(--block)}

#content{position:absolute;left:232px;top:190px;width:1120px;display:flex;flex-direction:column;gap:34px}
#content.in{animation:fade .45s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

.meta{font-size:30px;color:var(--muted);letter-spacing:.01em;display:flex;gap:28px;align-items:center}
.meta b{font-weight:500;color:var(--ink)}

.block{display:block}
.title{font-family:"Archivo",sans-serif;font-weight:700;line-height:1.04;letter-spacing:-.02em;font-size:112px;padding:4px 0 8px}
.title.m{font-size:76px}
.title.l{font-size:56px;line-height:1.1}
.title.xl{font-size:40px;line-height:1.15}
.desc{font-family:"Inter",sans-serif;font-weight:400;font-size:46px;line-height:1.28;padding:6px 0}
.desc.s{font-size:38px}
.speakers{display:flex;flex-wrap:wrap;gap:20px 52px;font-size:38px;line-height:1.2}
.speakers span{display:inline-flex;align-items:center}
.sp-note{font-size:30px;color:var(--muted)}

/* ---------- Key visual: first slide of every room ---------- */
#kv{position:absolute;inset:0;display:none}
body.kv #kv{display:block}
body.kv #content,body.kv #pixels,body.kv #dy{display:none}
body.kv #logo{left:120px;top:37px;opacity:1}

/* ---------- Break screens (coffee, lunch): full-screen block field ---------- */
#brk{position:absolute;inset:0;display:none}
body.brk #brk{display:block}
body.brk #content,body.brk #pixels,body.brk #pxcanvas,body.brk #brkWs{display:none}
body.brk #footer{display:flex;justify-content:center;align-items:center;gap:120px;height:62px}
body.brk #footer > *{position:static;width:auto}
#brkcanvas{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
#brkTitle{position:absolute;left:0;right:0;top:540px;transform:translateY(-50%);text-align:center;font-family:"Archivo",sans-serif;font-weight:700;font-size:92px;line-height:1.05;letter-spacing:-.01em;color:var(--lime)}
#brkTitle.brk-s{font-size:48px;line-height:1.2}
#brkDesc{position:absolute;left:0;right:0;top:620px;text-align:center;font-family:"Inter",sans-serif;font-weight:400;font-size:40px;color:#fff}
#brkWs{position:absolute;left:1567px;top:962px;font-family:"Inter",sans-serif;font-size:27px;line-height:1.04;color:#fff}
#kvimgs{position:absolute;inset:0;z-index:0}
#kvimgs img{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;display:block}
#kvoverlay{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--navy);opacity:.3}
#kvtext{position:absolute;left:262px;top:160px;width:1152px;display:flex;flex-direction:column;gap:20px}
#kvdate{font-family:"Inter",sans-serif;font-weight:500;font-size:24px;color:#fff}
#kvtitle h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:94px;line-height:1.02;letter-spacing:0;color:#fff}

/* ---------- Footer: logo · workshop · day (always visible) ---------- */
#footer{position:absolute;left:0;right:0;top:925px;height:90px}
#footer > *{position:absolute;top:0}
#logo{left:232px;top:5px;width:285px;height:53px;display:flex;align-items:center;gap:14px;opacity:.5}
.logo-text{font-family:"Inter",sans-serif;font-size:26px;color:var(--ink);white-space:nowrap}
.logo-text b{font-weight:800}
.logo-text span{font-weight:500;opacity:.8}
#dy{left:741px;width:893px;font-size:26px;line-height:1.2;color:var(--muted)}

/* ---------- Controls (fade away when idle) ---------- */
#bar{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;
  display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center;
  padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);
  max-width:calc(100vw - 24px);width:max-content;transition:opacity .35s}
body.idle #bar{opacity:0;pointer-events:none}
.grp{display:flex;gap:4px}
.grp+.grp{padding-left:14px;border-left:1px solid var(--line)}
button{font:500 14px "Inter",sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--navy-deep)}
button.live[aria-pressed="true"]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--navy-deep);margin-right:8px}

select{font:500 14px "Inter",sans-serif;color:var(--ink);background:var(--navy-deep);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:300px;max-width:100%;cursor:pointer;text-overflow:ellipsis}
select:hover{border-color:var(--ink)}
select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* ---------- Editor ---------- */
#editor{position:fixed;inset:0;z-index:30;background:rgba(10,12,40,.75);display:none;align-items:center;justify-content:center;padding:16px}
#editor.open{display:flex}
#editor form,#editor .card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--navy-deep);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
#editor h2{font:700 20px "Archivo",sans-serif}
#editor label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
#editor input,#editor textarea{font:400 16px "Inter",sans-serif;color:var(--ink);background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
#editor textarea{min-height:90px;resize:vertical}
#editor .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#editor p{font-size:14px;color:var(--muted);line-height:1.5}
#editor select{width:100%}
#editor.exporting{background:var(--navy-deep)}
.track{height:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:var(--lime)}
button.primary{background:var(--lime);border-color:var(--lime);color:var(--navy-deep);font-weight:500}

@media (prefers-reduced-motion:reduce){#content.in{animation:none}#bar{transition:none}}
</style>

  while (BRK.idx < BRK_EV.length && BRK_EV[BRK.idx] <= f) { const c = BRK_EV[BRK.idx + 1]; BRK.st[c] ^= 1; brkDraw(c); BRK.idx += 2; }
}
function brkStart(){
  if (BRK.on) return; BRK.on = true;
  BRK.ctx = document.getElementById('brkcanvas').getContext('2d');

  if (!reduceMotion) BRK.tick = setInterval(brkFrame, 40);
}

/* ---------- session slides: subtle pixel field on the same 44px grid as the key visual ---------- */
const px = {ctx:null, P:null, t:null, a:null, cand:[], raf:null, tick:null, last:0, on:false, dirty:new Set()};
function pxInit(){
  px.ctx = $('pxcanvas').getContext('2d');
  const N = KV_ROWS * KV_COLS, base = new Array(N).fill(0), k = 1920 / 1456;
  document.querySelectorAll('#pixels rect').forEach(r => {
    const x = +r.getAttribute('x') * k, y = +r.getAttribute('y') * k, w = +r.getAttribute('width') * k, h = +r.getAttribute('height') * k;
    for (let row = 0; row < KV_ROWS; row++) for (let c = 0; c < KV_COLS; c++) {
      const cx = c * KV_C + KV_C / 2, cy = row * KV_C + KV_C / 2;
      if (cx >= x && cx < x + w && cy >= y && cy < y + h) base[row * KV_COLS + c] = 1;
    }
  });
  // probability a cell is on: solid inside the original blocks, wobbling along their edges
  px.P = base.map((_, i) => {
    const row = Math.floor(i / KV_COLS), c = i % KV_COLS; let s = 0, n = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = row + dr, cc = c + dc;
      if (rr < 0 || rr >= KV_ROWS || cc < 0 || cc >= KV_COLS) continue;
      const wgt = (dr || dc) ? 1 : 2; s += base[rr * KV_COLS + cc] * wgt; n += wgt;
    }
    const avg = s / n; return Math.max(c >= 28 ? .08 : 0, Math.min(1, (avg - .5) * 1.1 + .5));
  });
  px.cand = []; px.P.forEach((p, i) => { if (p > .03 && p < .97) px.cand.push(i); });
  px.t = base.slice(); px.a = base.slice(); px.base = base.slice();
  for (let i = 0; i < N; i++) pxDraw(i);
}
function pxDraw(i){
  const row = Math.floor(i / KV_COLS), c = i % KV_COLS, x = c * KV_C, y = row * KV_C, g = px.ctx;
  g.clearRect(x, y, KV_C, KV_C);
  if (px.a[i] > 0) { g.globalAlpha = px.a[i]; g.fillStyle = '#1C352B'; g.fillRect(x, y, KV_C, KV_C); g.globalAlpha = 1; }
}
function pxFrame(ts){
  if (!px.on) return;
  const d = (ts - px.last) / 220; px.last = ts;
  px.dirty.forEach(i => {
    const tg = px.t[i], a = px.a[i];
    px.a[i] = tg > a ? Math.min(tg, a + d) : Math.max(tg, a - d);
    pxDraw(i);
    if (px.a[i] === tg) px.dirty.delete(i);
  });
  px.raf = requestAnimationFrame(pxFrame);
}
function pxStep(){
  const n = 2 + Math.floor(Math.random() * 5) + (Math.random() < .08 ? 8 : 0);   // a few cells each time, now and then a burst
  for (let k = 0; k < n; k++) {
    const i = px.cand[Math.floor(Math.random() * px.cand.length)];
    const v = Math.random() < px.P[i] ? 1 : 0;
    if (v !== px.t[i]) { px.t[i] = v; px.dirty.add(i); }
  }
}
function pxStart(){
  if (px.on) return; px.on = true; px.last = performance.now();
  px.raf = requestAnimationFrame(pxFrame);
  if (!reduceMotion) pxLoop();
}
function pxLoop(){ px.tick = setTimeout(() => { pxStep(); pxLoop(); }, 40 + Math.random() * 110); }   // irregular rhythm
function pxStop(){ if (!px.on) return; px.on = false; cancelAnimationFrame(px.raf); clearTimeout(px.tick); }

/* =====================================================================
   VIDEO EXPORT: every slide as a seamless 1920×1080 loop (MP4, H.264)
   Each frame is drawn on a canvas at an exact time, so loops are exact.
   ===================================================================== */
/* ---- minimal MP4 muxer: one H.264 (avcC) video track, constant frame rate, moov before mdat ---- */
function mp4Mux(o){
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  const u16 = n => [(n >> 8) & 255, n & 255];
  const str = s => Array.from(s).map(c => c.charCodeAt(0));
  const cat = (...a) => {
    const parts = a.map(x => x instanceof Uint8Array ? x : Uint8Array.from(x));
    let n = 0; parts.forEach(x => n += x.length);
    const out = new Uint8Array(n); let p = 0; parts.forEach(x => { out.set(x, p); p += x.length; });
    return out;
  };
  const box  = (type, ...c) => { const body = cat(...c); return cat(u32(body.length + 8), str(type), body); };
  const fbox = (type, ver, flags, ...c) => box(type, [ver, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255], ...c);
  const N = o.samples.length, TS = Math.round(o.fps * 1000), DUR = 1000;
  const trackDur = N * DUR, movieDur = Math.round(N / o.fps * 1000);
  const matrix = cat(u32(0x00010000), u32(0), u32(0), u32(0), u32(0x00010000), u32(0), u32(0), u32(0), u32(0x40000000));
  const keys = []; o.samples.forEach((s, i) => { if (s.key) keys.push(i + 1); });
  const stsd = fbox('stsd', 0, 0, u32(1), box('avc1',
      [0,0,0,0,0,0], u16(1), u16(0), u16(0), u32(0), u32(0), u32(0), u16(o.width), u16(o.height),
      u32(0x00480000), u32(0x00480000), u32(0), u16(1), new Array(32).fill(0), u16(0x18), u16(0xFFFF),
      box('avcC', o.desc)));
  const moov = offset => box('moov',
    fbox('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(movieDur), u32(0x00010000), u16(0x0100), u16(0), u32(0), u32(0),
         matrix, new Array(24).fill(0), u32(2)),
    box('trak',
      fbox('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(movieDur), u32(0), u32(0), u16(0), u16(0), u16(0), u16(0),
           matrix, u32(o.width << 16), u32(o.height << 16)),
      box('mdia',
        fbox('mdhd', 0, 0, u32(0), u32(0), u32(TS), u32(trackDur), u16(0x55c4), u16(0)),
        fbox('hdlr', 0, 0, u32(0), str('vide'), u32(0), u32(0), u32(0), str('VideoHandler'), [0]),
        box('minf',
          fbox('vmhd', 0, 1, u16(0), u16(0), u16(0), u16(0)),
          box('dinf', fbox('dref', 0, 0, u32(1), fbox('url ', 0, 1))),
          box('stbl', stsd,
            fbox('stts', 0, 0, u32(1), u32(N), u32(DUR)),
            fbox('stss', 0, 0, u32(keys.length), ...keys.map(u32)),
            fbox('stsc', 0, 0, u32(1), u32(1), u32(N), u32(1)),
            fbox('stsz', 0, 0, u32(0), u32(N), ...o.samples.map(s => u32(s.data.length))),
            fbox('stco', 0, 0, u32(1), u32(offset)))))));
  const ftyp = box('ftyp', str('isom'), u32(512), str('isom'), str('iso2'), str('avc1'), str('mp41'));
  let total = 0; o.samples.forEach(s => total += s.data.length);
  const moovSize = moov(0).length;
  const moovBox = moov(ftyp.length + moovSize + 8);
  const mdatHead = cat(u32(total + 8), str('mdat'));
  return new Blob([ftyp, moovBox, mdatHead, ...o.samples.map(s => s.data)], {type: 'video/mp4'});
}


const EXP = { busy:false, cancel:false, tex:null };
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const tick0 = () => new Promise(r => setTimeout(r, 0));

function cssEase(x){   // cubic-bezier(.25,.1,.25,1), the CSS "ease" curve used by the screen
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bez = (a, b, t) => 3 * a * (1 - t) * (1 - t) * t + 3 * b * (1 - t) * t * t + t * t * t;
  let lo = 0, hi = 1, t = x;
  for (let i = 0; i < 24; i++) { t = (lo + hi) / 2; if (bez(.25, .25, t) < x) lo = t; else hi = t; }
  return bez(.1, 1, t);
}

async function expTexture(){
  return null; // grain texture removed
}

/* Read the exact positions of every piece of text, bar and logo from the slide that is on screen. */
function expHarvest(){
  const stage = $('stage'), sr = stage.getBoundingClientRect(), k = sr.width / 1920;
  const X = v => (v - sr.left) / k, Y = v => (v - sr.top) / k;
  const shown = e => e.getClientRects().length > 0;
  const ancestorAlpha = e => { let a = 1; for (let n = e; n && n !== stage; n = n.parentElement) { const ao = parseFloat(getComputedStyle(n).opacity); if (!Number.isNaN(ao)) a *= ao; } return a; };
  const texts = [], circles = [];
  const rg = document.createRange(), walker = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    const txt = n.nodeValue; if (!/\S/.test(txt)) continue;
    const el = n.parentElement; if (!shown(el)) continue;
    const cs = getComputedStyle(el), upper = cs.textTransform === 'uppercase';
    const alpha = ancestorAlpha(el);
    const lines = []; let cur = null;
    for (let i = 0; i < txt.length; i++) {
      if (/\s/.test(txt[i])) continue;
      rg.setStart(n, i); rg.setEnd(n, i + 1);
      const rs = rg.getClientRects(); if (!rs.length) continue;
      const top = Y(rs[0].top);
      if (!cur || Math.abs(top - cur.top) > 6) { cur = {top, left:X(rs[0].left), a:i, b:i}; lines.push(cur); }
      cur.b = i;
    }
    lines.forEach(L => {
      let t = txt.slice(L.a, L.b + 1); if (upper) t = t.toUpperCase();
      texts.push({text:t, x:L.left, top:L.top, color:cs.color, alpha,
                  font:`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`,
                  ls:cs.letterSpacing === 'normal' ? '0px' : cs.letterSpacing});
    });
  }
  stage.querySelectorAll('#logo circle').forEach(e => {
    if (!shown(e)) return;
    const r = e.getBoundingClientRect(), cs = getComputedStyle(e);
    circles.push({cx:X(r.left + r.width / 2), cy:Y(r.top + r.height / 2), rr:(r.width / 2) / k,
                  fill:cs.fill, fillOpacity:parseFloat(cs.fillOpacity || '1'), alpha:ancestorAlpha(e)});
  });
  return {texts, circles};
}

function expLayer(h){
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080;
  const g = c.getContext('2d');
  h.circles.forEach(ci => {
    g.globalAlpha = ci.alpha * ci.fillOpacity; g.fillStyle = ci.fill;
    g.beginPath(); g.arc(ci.cx, ci.cy, ci.rr, 0, Math.PI * 2); g.fill();
  });
  g.globalAlpha = 1;
  g.textBaseline = 'alphabetic';
  h.texts.forEach(t => {
    g.font = t.font; g.fillStyle = t.color; g.globalAlpha = t.alpha; if ('letterSpacing' in g) g.letterSpacing = t.ls;
    g.fillText(t.text, t.x, Math.round(t.top + g.measureText('Hg').fontBoundingBoxAscent));
  });
  g.globalAlpha = 1;
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  return c;
}

function expTextureOn(ctx){
  // grain texture removed: no-op
}

/* ---- scenes: draw(ctx, t) paints the slide at time t seconds; t = loop length gives the first frame again ---- */
function sceneSession(seed, layer){
  return {fps:30, loop:5, draw(ctx, t, o = {}){
    ctx.fillStyle = '#12211C'; ctx.fillRect(0, 0, 1920, 1080);
    if (!o.bare) {
      if (kv.img) ctx.drawImage(kv.img, 0, 0, 1920, 1080);
      ctx.fillStyle = 'rgba(18,33,28,.3)'; ctx.fillRect(0, 0, 1920, 1080);
    }
    ctx.drawImage(layer, 0, 0); if (!o.noTexture) expTextureOn(ctx);
  }};
}

function sceneKV(layer){
  return {fps:30, loop:5, draw(ctx, t, o = {}){
    ctx.fillStyle = '#16281F'; ctx.fillRect(0, 0, 1920, 1080);
    if (!o.bare) {
      if (kv.img) ctx.drawImage(kv.img, 0, 0, 1920, 1080);
      ctx.fillStyle = 'rgba(18,33,28,.55)'; ctx.fillRect(0, 0, 1920, 1080);
    }
    ctx.drawImage(layer, 0, 0); if (!o.noTexture) expTextureOn(ctx);
  }};
}

function sceneBreak(layer){
  return {fps:30, loop:5, draw(ctx, t, o = {}){
    ctx.fillStyle = '#0E1A16'; ctx.fillRect(0, 0, 1920, 1080);
    if (!o.bare) {
      if (kv.img) ctx.drawImage(kv.img, 0, 0, 1920, 1080);
      ctx.fillStyle = 'rgba(18,33,28,.3)'; ctx.fillRect(0, 0, 1920, 1080);
    }
    ctx.drawImage(layer, 0, 0); if (!o.noTexture) expTextureOn(ctx);
  }};
}

function expScene(s, key){
  const layer = expLayer(expHarvest());
  const sc = s.kv ? sceneKV(layer) : (s.kind === 'break' || s.kind === 'divider') ? sceneBreak(layer) : sceneSession(key, layer);
  if (window.__EXP_LOOP) sc.loop = Math.min(sc.loop, window.__EXP_LOOP);
  return sc;
}

/* ---- encoding ---- */
async function expEncode(scene, prog){
  const fps = scene.fps, N = Math.round(scene.loop * fps);
  const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080;
  const ctx = cv.getContext('2d', {alpha:false});
  let cfg = null;
  if (typeof VideoEncoder !== 'undefined' && typeof VideoFrame !== 'undefined') {
    for (const codec of (window.__EXP_CODECS || ['avc1.64002a', 'avc1.4d002a', 'avc1.42002a'])) {
      const c = {codec, width:1920, height:1080, bitrate:10e6, framerate:fps, latencyMode:'quality', bitrateMode:'variable'};
      if (codec.startsWith('avc1')) c.avc = {format:'avc'};
      try { const r = await VideoEncoder.isConfigSupported(c); if (r.supported) { cfg = c; break; } } catch(e){}
    }
  }
  if (!cfg) return expRecord(scene, cv, ctx, prog);
  const samples = []; let desc = null, fail = null;
  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
      samples.push({data:d, key:chunk.type === 'key'});
      const dc = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (dc && !desc) desc = new Uint8Array(ArrayBuffer.isView(dc) ? dc.buffer.slice(dc.byteOffset, dc.byteOffset + dc.byteLength) : dc.slice(0));
    },
    error: e => { fail = e; }
  });
  enc.configure(cfg);
  for (let i = 0; i < N; i++) {
    if (EXP.cancel) { try { enc.close(); } catch(e){} return null; }
    if (fail) throw fail;
    scene.draw(ctx, i / fps);
    const fr = new VideoFrame(cv, {timestamp:Math.round(i * 1e6 / fps), duration:Math.round(1e6 / fps)});
    enc.encode(fr, {keyFrame: i % 60 === 0}); fr.close();
    while (enc.encodeQueueSize > 8) await tick0();
    if (i % 6 === 0) { prog(i / N); await tick0(); }
  }
  await enc.flush(); enc.close(); if (fail) throw fail;
  if (window.__EXP_TEST) return {test:true, frames:samples.length, keys:samples.filter(s => s.key).length, hasDesc:!!desc, codec:cfg.codec};
  if (!desc) throw new Error('The encoder gave no H.264 configuration.');
  return {blob:mp4Mux({width:1920, height:1080, fps, desc, samples}), ext:'mp4'};
}

/* fallback for browsers without an H.264 encoder: records in real time (WebM, or MP4 where supported) */
async function expRecord(scene, cv, ctx, prog){
  if (typeof MediaRecorder === 'undefined') throw new Error('This browser cannot record video. Use a recent Chrome, Edge or Safari.');
  const mime = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const stream = cv.captureStream(scene.fps), chunks = [];
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:10e6});
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => rec.onstop = r);
  scene.draw(ctx, 0); rec.start(1000);
  const t0 = performance.now();
  await new Promise(res => {
    const step = () => {
      const t = (performance.now() - t0) / 1000;
      if (EXP.cancel || t >= scene.loop) { res(); return; }
      scene.draw(ctx, t); prog(t / scene.loop); setTimeout(step, 1000 / scene.fps);
    };
    step();
  });
  rec.stop(); await stopped; stream.getTracks().forEach(t => t.stop());
  if (EXP.cancel) return null;
  return {blob:new Blob(chunks, {type:mime.split(';')[0]}), ext: mime.startsWith('video/mp4') ? 'mp4' : 'webm'};
}

/* ---- which slides, and what to call the files ---- */
/* ---- which slides, and what to call the files ---- */
function expList(scope){
  const out = [];
  const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, '');
  timeline().forEach((s, idx) => {
    if (scope === 'current' && idx !== state.idx) return;
    const name = `wppt_${String(idx).padStart(2, '0')}_${slug(s.kv ? 'key-visual' : s.title)}`;
    out.push({idx, name, label: s.kv ? 'Key visual' : s.title});
  });
  return out;
}

async function expDownloader(){
  let dl = null;
  try { if (window.claude && claude.use) dl = await claude.use('downloads'); } catch(e){}
  return async (blob, name) => {
    if (dl) { try { await dl.save({filename:name, data:blob}); return 'saved'; } catch(e){ return e && e.code === 'declined' ? 'declined' : 'failed'; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.style.display = 'none';
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 15000);
    await new Promise(r => setTimeout(r, 500));
    return 'saved';
  };
}

async function expSlide(item, prog){
  state.auto = false; state.idx = item.idx; render(false);
  const s = timeline()[item.idx];
  return expEncode(expScene(s, item.name), prog);
}

/* ---- dialog ---- */
function openExport(){
  if (EXP.busy) return;
  const ed = $('editor'); ed.textContent = ''; ed.classList.remove('exporting');
  const f = el('form'); const h = el('h2', null, 'Export videos'); h.id = 'edTitle'; f.append(h);
  f.append(el('p', null, 'Each slide becomes a 1920×1080 MP4 that loops seamlessly. The key visual loops every 15 seconds, break and section cards every 40 and session slides every 10.'));
  const lab = el('label', null, 'What to export'); const sel = el('select');
  [['current', 'This slide'], ['all', 'Every slide in the program']]
    .forEach(([v, t]) => { const o = el('option', null, t); o.value = v; sel.append(o); });
  lab.append(sel); f.append(lab);
  const info = el('p'); f.append(info);
  const upd = () => { const n = expList(sel.value).length; info.textContent = `${n} video${n === 1 ? '' : 's'}. Keep this tab open and visible while it runs.`; };
  sel.onchange = upd; upd();
  const row = el('div', 'row'); const cancel = el('button', null, 'Cancel'); cancel.type = 'button'; cancel.onclick = closeEditor;
  const go = el('button', 'primary', 'Start export'); go.type = 'submit'; row.append(cancel, go); f.append(row);
  f.onsubmit = e => { e.preventDefault(); runExport(sel.value); };
  ed.append(f); ed.classList.add('open');
}

async function runExport(scope){
  const items = expList(scope), ed = $('editor');
  const saved = {idx:state.idx, auto:state.auto};
  EXP.busy = true; EXP.cancel = false;
  ed.textContent = ''; ed.classList.add('exporting', 'open');
  const card = el('div', 'card'); const h = el('h2', null, 'Exporting…'); const status = el('p', null, '');
  const track = el('div', 'track'); const fill = el('div', 'fill'); track.append(fill);
  const note = el('p', null, 'Keep this tab open and visible. Files are saved to your downloads as they finish.');
  const row = el('div', 'row'); const stop = el('button', null, 'Stop'); row.append(stop);
  stop.onclick = () => { EXP.cancel = true; stop.disabled = true; status.textContent = 'Stopping…'; };
  card.append(h, status, track, note, row); ed.append(card);
  let done = 0, failMsg = '';
  try {
    await document.fonts.ready; await expTexture();
    const save = await expDownloader();
    for (let n = 0; n < items.length && !EXP.cancel; n++) {
      status.textContent = `${n + 1} of ${items.length}: ${items[n].label}`;
      const res = await expSlide(items[n], p => { fill.style.width = (((n + p) / items.length) * 100).toFixed(1) + '%'; });
      if (!res) break;
      if (res.test) { done++; window.__EXP_RESULT = res; continue; }
      const r = await save(res.blob, items[n].name + '.' + res.ext);
      if (r === 'declined') { EXP.cancel = true; break; }
      if (r === 'saved') done++;
    }
  } catch(e){ failMsg = (e && e.message) || String(e); }
  state.idx = saved.idx; state.auto = saved.auto;
  EXP.busy = false; render(true);
  ed.classList.remove('exporting');
  h.textContent = failMsg ? 'Export stopped' : EXP.cancel ? 'Export stopped' : 'Export finished';
  status.textContent = failMsg ? failMsg : `${done} of ${items.length} video${items.length === 1 ? '' : 's'} saved.`;
  fill.style.width = (failMsg || EXP.cancel ? fill.style.width : '100%');
  row.textContent = ''; const close = el('button', 'primary', 'Close'); close.onclick = closeEditor; row.append(close);
  window.__EXP_DONE = {done, total:items.length, failMsg};
}

/* ---------- boot ---------- */
fit();
kvInit(); pxInit();
if (!readHash()) { const ls = liveState(); state.idx = ls.idx; }
render(true);
wake();
(async () => {
  await CONFIG.boot();   // server clock
  tick();
  setInterval(tick, 15000);
  CONFIG.startPolling();  // keeps the clock offset fresh
})();
</script>
