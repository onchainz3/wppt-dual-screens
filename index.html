<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WPPT 2026 — Dual screens</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12211C;
    --ink:#FFF8F0;
    --muted:#B3C4BC;
    --accent:#FF5C1F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--navy);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:40px}
  main{width:min(560px,100%);display:flex;flex-direction:column;gap:28px}
  .eyebrow{font-size:14px;font-weight:500;color:var(--accent)}
  h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:32px;line-height:1.1}
  .links{display:flex;flex-direction:column;gap:14px}
  a.card{display:flex;flex-direction:column;gap:4px;padding:20px 22px;border:1px solid rgba(255,248,240,.18);border-radius:4px;text-decoration:none;color:var(--ink)}
  a.card:hover{border-color:var(--accent)}
  a.card b{font-family:"Archivo",sans-serif;font-size:18px}
  a.card span{font-size:14px;color:var(--muted)}
  #logo{display:flex;align-items:center;gap:10px;opacity:.7}
  #logo svg{width:28px;height:28px}
  #logo span{font-size:15px}
  #logo b{font-weight:800}
</style>
</head>
<body>
<main>
  <div id="logo" aria-label="WPPT 2026">
    <svg viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="21" cy="21" r="17" fill="#ff5c1f" fill-opacity="0.82"></circle>
      <circle cx="36" cy="35" r="18" fill="#fcbe41" fill-opacity="0.82"></circle>
    </svg>
    <span><b>WPPT</b> 2026</span>
  </div>
  <div>
    <div class="eyebrow">Booth &amp; stage signage</div>
    <h1>Pick a screen</h1>
  </div>
  <div class="links">
    <a class="card" href="big.html">
      <b>Big screen</b>
      <span>Looping YouTube talks (75")</span>
    </a>
    <a class="card" href="small.html">
      <b>Small screen</b>
      <span>Synced talk titles + resource links (46")</span>
    </a>
    <a class="card" href="stage.html">
      <b>Stage</b>
      <span>Session schedule for the workshop room, follows the clock</span>
    </a>
  </div>
</main>
</body>
</html>
